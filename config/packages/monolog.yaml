# Les journaux ne contiennent jamais d'en-têtes HTTP, de tokens ni de secrets :
# les services n'y écrivent que des identifiants de connexion, des chemins d'API et des codes d'erreur.
monolog:
    channels: ['integration', 'publication']

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: info
                max_files: 30
            integration:
                type: rotating_file
                path: '%kernel.logs_dir%/integration.log'
                level: info
                max_files: 30
                channels: ['integration', 'publication']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
